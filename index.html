<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffb8d8">
<title>Only for Pratiti ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--pink:#ffadd1;--rose:#f15b9e;--lemon:#fff19b;--blue:#aeeaff;--ink:#5b3850;--paper:#fffdf7;--lav:#e8ddff}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Nunito,sans-serif;background:#fff8ec;overflow-x:hidden}
button,input{font:inherit}button{cursor:pointer}#app{min-height:100vh;position:relative;isolation:isolate;background:radial-gradient(circle at 10% 8%,#fff 0 3%,transparent 3.5%),linear-gradient(135deg,#fff0f7,#fff8c9 53%,#e8f8ff)}
#app:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(#fff 1.5px,transparent 1.5px),radial-gradient(#f48bb8 1px,transparent 1px);background-size:48px 48px,75px 75px;background-position:0 0,22px 30px;z-index:-1}
.page{min-height:100vh;padding:30px 16px 65px;display:flex;align-items:center;justify-content:center}
.panel{width:min(900px,100%);padding:clamp(24px,5vw,52px);margin:auto;background:#ffffffdf;border:3px solid white;border-radius:34px;box-shadow:0 22px 65px #bd639126;position:relative;backdrop-filter:blur(12px)}
.panel:before{content:"";position:absolute;inset:9px;border:2px dashed #ffb9d6;border-radius:26px;pointer-events:none}
.inner{position:relative;z-index:1}.center{text-align:center}.kicker{text-transform:uppercase;letter-spacing:.18em;font-size:.72rem;font-weight:1000;color:#d95796}
h1,h2{font-family:"Baloo 2",sans-serif;line-height:1.03}h1{font-size:clamp(2.7rem,8vw,5.5rem);margin:12px 0;color:#e94e96}h2{font-size:clamp(2rem,5vw,3.4rem);color:#e94e96;margin:12px 0}
.script{font-family:Pacifico,cursive;color:#ee5d9e}.sub{font-size:1.08rem;line-height:1.8;max-width:670px;margin:0 auto 22px}
.cat{width:118px;height:100px;margin:0 auto 14px;position:relative;animation:bob 2.6s ease-in-out infinite}
.cat-face{position:absolute;left:15px;top:20px;width:88px;height:70px;border:3px solid #e8d9dd;background:#fff;border-radius:48% 48% 45% 45%;box-shadow:0 7px 0 #f8dce8}
.ear{position:absolute;top:5px;width:29px;height:34px;background:#fff;border:3px solid #e8d9dd;transform:rotate(12deg);border-radius:7px 22px 4px 7px}
.ear.l{left:18px}.ear.r{right:16px;transform:rotate(-12deg)}
.eye{position:absolute;top:47px;width:6px;height:9px;border-radius:50%;background:#58464e}.eye.l{left:40px}.eye.r{right:39px}
.nose{position:absolute;left:57px;top:57px;width:9px;height:7px;border-radius:50%;background:#f3c94d}
.whisk{position:absolute;top:59px;width:22px;height:2px;background:#a99ba1}.whisk.a{left:17px;transform:rotate(9deg)}.whisk.b{left:16px;top:67px;transform:rotate(-8deg)}.whisk.c{right:16px;transform:rotate(-9deg)}.whisk.d{right:16px;top:67px;transform:rotate(8deg)}
.bow{position:absolute;right:2px;top:7px;width:28px;height:22px;z-index:3}.bow:before,.bow:after{content:"";position:absolute;width:17px;height:20px;background:#ff79b6;border:2px solid #e94e96;border-radius:9px 3px 9px 3px}.bow:before{left:0;transform:rotate(28deg)}.bow:after{right:0;transform:rotate(-28deg)}.bow i{position:absolute;z-index:2;left:11px;top:8px;width:8px;height:8px;background:#ffe36f;border:1px solid #e94e96;border-radius:50%}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
.btn{border:0;border-radius:999px;padding:14px 25px;font-weight:1000;color:white;background:linear-gradient(100deg,#f15b9e,#fa91bc);box-shadow:0 9px 20px #e65c9b3b;transition:.2s}
.btn:hover{transform:translateY(-3px)}.btn.blue{background:linear-gradient(100deg,#65c5e9,#9ce5f5);color:#24546b}.btn.yellow{background:linear-gradient(100deg,#f4d94f,#ffe98a);color:#6b5420}
.field{width:min(390px,100%);display:block;margin:15px auto 8px;border:2px solid #ffc1dc;border-radius:17px;padding:15px;background:#fff;font-weight:900;color:var(--ink);outline:none;text-align:center}
.field:focus{border-color:#65c6eb;box-shadow:0 0 0 4px #aee8ff65}.hint{font-size:.88rem;color:#987186;margin-bottom:16px}.msg{min-height:26px;font-weight:900;color:#e34d91;margin:8px 0}
.pill{display:inline-flex;background:var(--lemon);border:1px solid #f4df72;border-radius:999px;padding:8px 15px;font-weight:1000;font-size:.85rem}
.small{font-size:.84rem;opacity:.72}.note{background:#fff7ce;border:1px solid #f4e28a;border-radius:22px;padding:20px;margin:18px auto;max-width:680px;line-height:1.8}
.story{background:#fff;border:1px solid #ffd2e5;border-radius:24px;padding:clamp(22px,4vw,38px);box-shadow:0 12px 32px #d26a9b17;text-align:left;line-height:1.95;font-size:1.04rem}.story p{margin:0 0 15px}.story p:last-child{margin:0}
.story-label{display:inline-block;background:#dff6ff;border-radius:999px;padding:6px 12px;font-size:.78rem;font-weight:1000;color:#377d9c;margin-bottom:14px}
.nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}.dots{display:flex;gap:7px;justify-content:center;margin:20px 0}.dots i{width:8px;height:8px;border-radius:9px;background:#ffc1dc}.dots i.active{width:23px;background:#ec5a9c}
.topbar{position:fixed;z-index:5;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.topbar>*{pointer-events:auto}
.music{border:1px solid #fff;background:#ffffffdf;color:#9e4774;border-radius:999px;padding:9px 13px;font-weight:900;box-shadow:0 4px 14px #a14e7620}
.progress{height:6px;background:#ffe0ed;border-radius:9px;overflow:hidden;width:min(150px,35vw)}.progress span{display:block;height:100%;width:0;background:#ec5a9c;transition:width .5s}
.reveal{animation:reveal .65s cubic-bezier(.2,.8,.2,1) both}@keyframes reveal{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.date{font-family:"Baloo 2";font-size:clamp(1.5rem,5vw,2.4rem);font-weight:900;letter-spacing:.1em;color:#5aaed3;background:#e7f8ff;border-radius:18px;padding:12px 20px;display:inline-block}
.float{position:fixed;z-index:2;pointer-events:none;animation:up 5s linear forwards;font-size:20px}@keyframes up{from{transform:translateY(0);opacity:0}10%{opacity:1}to{transform:translateY(-110vh) rotate(35deg);opacity:0}}
@media(max-width:600px){.page{padding:70px 12px 32px}.panel{border-radius:26px;padding:26px 19px}.story{font-size:1rem}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar hidden" id="topbar"><button class="music" id="musicBtn">♫ Music: OFF</button><div class="progress"><span id="progressBar"></span></div></div>
  <main id="stage" class="page">
    <section class="panel center reveal"><div class="inner">
      <div class="cat"><div class="ear l"></div><div class="ear r"></div><div class="cat-face"></div><div class="eye l"></div><div class="eye r"></div><div class="nose"></div><div class="whisk a"></div><div class="whisk b"></div><div class="whisk c"></div><div class="whisk d"></div><div class="bow"><i></i></div></div>
      <div class="kicker">a tiny secret is waiting</div><h1>Birthday Girl,<br>is this youu???</h1>
      <p class="sub">A little pink-and-lemon world made for one very special, very tiny, very madarchod human.</p>
      <div class="pill">🎀 Only one girl gets in 🎀</div>
      <input class="field" id="entryPass" type="password" placeholder="Please enter key" autocomplete="off">
      <div class="hint">Hint: <b>Chowk</b></div><div class="msg" id="entryMsg"></div>
      <button class="btn" id="entryBtn">Open your little world 💗</button><p class="small" style="margin-top:18px">made with a suspicious amount of love ✨</p>
    </div></section>
  </main>
</div>
<script>
const stage=document.getElementById('stage'),topbar=document.getElementById('topbar'),musicBtn=document.getElementById('musicBtn');
let pageIndex=0,audioCtx=null,musicOn=false,musicTimer=null;
const pages=[
{label:"the beginning",title:"Who you?",body:[
"Who youuu?? You're my very achi wali bhadwi didi. A little maaiyaavi creature who has absolutely no idea when the world sleeps or wakes up. Din ho ya raat, madam ka schedule alag hi planet se aata hai.",
"And somehow, out of all the people in this duniya, I got you. My choti bachi. My laduu. My bestest didi. The same girl who calls me SUAR and madarchod with so much confidence 😭"
]},
{label:"school enemies",title:"Once upon a school bench…",body:[
"We actually started as enemies. SCHOOL MEIN. Main teri backchodi karta tha and tu apne attitude ke saath ghoomti thi. Who knew 10th class mein shuru hui ye dosti itni non-breakable ban jayegi?",
"Pehle bas school ki bakwaas thi, phir baatein badhti gayi. Aur phir 8–9 ghante calls normal ho gayi, 4–5 baje tak chats chalti thi, aur subah aankh khulte hi sabse pehla text ek dusre ko jaata tha.",
"Dosti kab itni zaroori ban gayi pata hi nahi chala. Ab din start hota hai toh tu hoti hai. Aur din khatam hota hai toh bhi tu hi hoti hai. Beech mein bas hum dono ki bakchodi chalti rehti hai 😭"
]},
{label:"daily dose of pagalpan",title:"A full-time headache 💗",body:[
"Tu ek number ki bauni, gandmari, bhenkilodi, madarchod aurat hai. Gussa bhi hoti hai, kilasti bhi hai, roti bhi hai, aur kabhi kabhi toh lagta hai tere dimaag mein 47 tabs khule hain aur sab hang ho rakhe hain 😭",
"Lekin teri har bachkani harkat pyaari hai. Tera muh poora band karke hasna, VC pe mujhe ghurna, aur woh side look… BHAI WOH SIDE LOOK. Haste hue side eyes deti hai na, meri toh wahi melting point ban jaati hai. Killer hai tu, samjhi?",
"Aur hamari famous ladai: main bolta hoon tu breakup kar le, aur tu bolti hai meri ex hi bhadwi thi. Matlab duniya ke saare serious topics chhod ke hum dono isi level pe debate karte hain. Kya namoone hain hum 😭"
]},
{label:"the real stuff",title:"When nobody else was there",body:[
"Jab mere saath koi nahi tha, jab ghar pe kalesh hote the, jab main khud ko samajh nahi paata tha, tab tu thi. Tu mujhe sambhalti thi. Tu mujhe sahi aur galat raaste dikhati thi.",
"Maine apni galti na hone par bhi kai baar galti maani hai, kyunki tune mujhe cheezein samjhaayi hain. Tune mujhe sirf suna nahi, samjha bhi hai. Aur ye cheez main kabhi lightly nahi le sakta.",
"Tere liye mere dil mein itni respect hai ki kabhi kabhi lagta hai tere pair dhoke paani pila doon. Haan haan, zyada udd mat jaana ab 😭 But seriously, tu mere liye bahut precious hai."
]},
{label:"a promise",title:"Exit pe lock laga diya hai 🔒",body:[
"Mujhe har din lagta hai ki tu kahin nahi jaayegi. Maine toh exit pe lock laga ke chaabi bhi fek di hai. Ab lifetime membership hai teri. No cancellation. No refund. Terms and conditions apply: roz mujhe tang karna compulsory hai.",
"Agar tu meri life mein nahi hoti na, toh sach mein bahut empty hota. Chand bina roshni ke jaisa. Tu meri life ka woh hissa hai jiske bina sab kuch hote hue bhi kuch missing lagega.",
"Aur sun, mera promise hai: hamesha tera rahunga, kutiya. Chahe kitne bhi utaar-chadhaav aayein, chahe hum kitna bhi ladein, chahe tu mujhe suar bole ya main tujhe bhenkilodi, main tera Mann rahunga. Tu meri choti bachi rahegi."
]},
{label:"your birthday wish",title:"For my November baby",body:[
"I hope you stay happy. I hope you become everything you dream of becoming. I hope life gives you a thousand reasons to smile, and whenever it gets difficult, I hope you remember that you don't have to face everything alone.",
"Tu jaisi hai na, waise hi rehna. Bas apne dreams poore karna, khud pe bharosa rakhna, aur apni hasi kabhi mat khona. Aur haan, thoda kam barnad hona, kyunki tune sab mujhe hi maan liya hai 😭",
"Jab tak suraj chand rahega, Mann aur Pratiti ka saath rahega. Ye line bas birthday wali line nahi hai. Ye mera promise hai, meri taraf se."
]}
];
function render(html){stage.innerHTML=`<section class="panel reveal"><div class="inner">${html}</div></section>`}
async function unlock(stageName,passcode){const r=await fetch('/api/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage:stageName,passcode})});return {ok:r.ok,...await r.json().catch(()=>({}))}}
document.getElementById('entryBtn').onclick=async()=>{let msg=document.getElementById('entryMsg'),res=await unlock('entry',document.getElementById('entryPass').value);if(!res.ok){msg.textContent=res.message||'Try again 💗';return}success()};
document.getElementById('entryPass').onkeydown=e=>{if(e.key==='Enter')document.getElementById('entryBtn').click()};
function success(){render(`<div class="center"><div class="cat"><div class="ear l"></div><div class="ear r"></div><div class="cat-face"></div><div class="eye l"></div><div class="eye r"></div><div class="nose"></div><div class="whisk a"></div><div class="whisk b"></div><div class="whisk c"></div><div class="whisk d"></div><div class="bow"><i></i></div></div><div class="kicker">passcode entered successfully</div><h1>You're eligible<br>to open thiss!</h1><p class="sub">Happiest birthday girlll 💗 Your little world is waiting.</p><button class="btn" id="go">Continue, birthday girl 🎂</button></div>`);document.getElementById('go').onclick=birthday}
function birthday(){topbar.classList.remove('hidden');render(`<div class="center"><div class="cat"><div class="ear l"></div><div class="ear r"></div><div class="cat-face"></div><div class="eye l"></div><div class="eye r"></div><div class="nose"></div><div class="whisk a"></div><div class="whisk b"></div><div class="whisk c"></div><div class="whisk d"></div><div class="bow"><i></i></div></div><div class="kicker">the day the world got you</div><h1>Happiest birthday,<br><span class="script">Pratiti!</span></h1><div class="date">19 | 11 | 2010</div><h2 style="color:#e9a92e;margin-top:20px">November wali bachi tu OMG 😭</h2><p class="sub">Aaj tera din hai. Nachooooo yayayayaya! Agaya woh din jab tu paida hui thiiii 🎉</p><div class="pill">🎀 my choti bachi · my laduu 🎀</div><div class="nav"><button class="btn yellow" id="birthdayNext">NEXT →</button></div><p class="small">This birthday moment moves on by itself too 💛</p></div>`);document.getElementById('birthdayNext').onclick=gate;setTimeout(()=>{if(document.getElementById('birthdayNext'))gate()},6000);hearts()}
function gate(){render(`<div class="center"><div class="cat"><div class="ear l"></div><div class="ear r"></div><div class="cat-face"></div><div class="eye l"></div><div class="eye r"></div><div class="nose"></div><div class="whisk a"></div><div class="whisk b"></div><div class="whisk c"></div><div class="whisk d"></div><div class="bow"><i></i></div></div><div class="kicker">a note with your name on it</div><h1>Only Pratiti<br>can read this.</h1><p class="sub">And it's made for her, not for any other rand ka bacha 😭</p><div class="note">This is not just a birthday page. It's a tiny world made for one girl who became family.</div><input class="field" id="secretPass" type="password" placeholder="Enter passcode"><div class="hint">Hint → the secret key 🤫</div><div class="msg" id="secretMsg"></div><button class="btn" id="secretBtn">Let me in 💗</button></div>`);document.getElementById('secretBtn').onclick=async()=>{let res=await unlock('secret',document.getElementById('secretPass').value);if(!res.ok){document.getElementById('secretMsg').textContent=res.message||'Not quite 😭';return}pageIndex=0;story()};document.getElementById('secretPass').onkeydown=e=>{if(e.key==='Enter')document.getElementById('secretBtn').click()}}
function story(){let p=pages[pageIndex],body=p.body.map(x=>`<p>${x}</p>`).join(''),dots=pages.map((_,i)=>`<i class="${i===pageIndex?'active':''}"></i>`).join('');render(`<div class="center"><span class="story-label">${p.label}</span><div class="kicker">a little story, just for you</div><h2>${p.title}</h2></div><article class="story">${body}</article><div class="dots">${dots}</div><div class="nav">${pageIndex?'<button class="btn blue" id="prev">← Back</button>':''}<button class="btn" id="next">${pageIndex===pages.length-1?'Read my last note 💌':'Next page →'}</button></div><p class="small center" style="margin-top:18px">take your time, bhenkilodi 🫂</p>`);document.getElementById('progressBar').style.width=(pageIndex+1)/pages.length*100+'%';document.getElementById('next').onclick=()=>{if(pageIndex<pages.length-1){pageIndex++;story()}else finalPage()};if(document.getElementById('prev'))document.getElementById('prev').onclick=()=>{pageIndex--;story()}}
function finalPage(){render(`<div class="center"><div class="cat"><div class="ear l"></div><div class="ear r"></div><div class="cat-face"></div><div class="eye l"></div><div class="eye r"></div><div class="nose"></div><div class="whisk a"></div><div class="whisk b"></div><div class="whisk c"></div><div class="whisk d"></div><div class="bow"><i></i></div></div><div class="kicker">one last thing, my bestest didi</div><h1 class="script">Pratiti…</h1><article class="story"><p>Happy birthday meri choti bachi. I don't think words are enough to explain how much you mean to me. Tu meri real sister nahi hai, lekin tere liye jo pyaar aur respect hai na, woh kisi khoon ke rishte se kam nahi hai.</p><p>Thank you for staying. Thank you for understanding me. Thank you for being my safe place, my daily first text, my 8–9 hour call partner, my overthinking listener, and the most pagal person I know.</p><p>Bas khush rehna. Hasti rehna. Apne saare dreams poore karna. Aur kabhi ye mat sochna ki tu akeli hai. Tera ye suar hamesha yahin hai.</p><p>Jab tak suraj chand rahega, Mann aur Pratiti ka saath rahega. Hamesha tera rahunga, kutiya. I love you, my bestest behennnn. 🫂💗</p></article><h2 style="margin-top:26px;color:#e9a92e">Bhadwii khush hojaa 😭</h2><p class="sub">Mere paas shabd nahi the… toh puri website hi bana dali maine.</p><div class="script" style="font-size:2rem">Made with love by Mann 🎀</div><p class="small">Only for Pratiti. Always.</p><button class="btn yellow" id="again">Read it all again ↺</button></div>`);document.getElementById('progressBar').style.width='100%';document.getElementById('again').onclick=()=>{pageIndex=0;story()};hearts()}
function hearts(){let symbols=['💗','🎀','💛','✨','🩵','🌼'];for(let i=0;i<20;i++)setTimeout(()=>{let el=document.createElement('div');el.className='float';el.textContent=symbols[Math.floor(Math.random()*symbols.length)];el.style.left=Math.random()*100+'vw';el.style.bottom='-30px';el.style.animationDuration=4+Math.random()*3+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),7500)},i*110)}
// Original gentle notes made in-browser; tap Music to start because phones require a user gesture.
function startMusic(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=audioCtx||new AC();audioCtx.resume();let notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23],n=0;let play=()=>{if(!musicOn)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=notes[n++%notes.length];g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.03,audioCtx.currentTime+.08);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+1.2);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+1.25)};play();musicTimer=setInterval(play,620)}
musicBtn.onclick=()=>{musicOn=!musicOn;musicBtn.textContent=musicOn?'♫ Music: ON':'♫ Music: OFF';if(musicOn)startMusic();else{clearInterval(musicTimer);if(audioCtx)audioCtx.suspend()}};
</script>
</body></html>
