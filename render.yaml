services:
  - type: web
    name: only-for-pratiti
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENTRY_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
